# ObCYDian web flasher
#
#   docker compose up -d --build                           # latest release
#   FIRMWARE_VERSION=v0.1.0 docker compose up -d --build   # a specific release
#
# After a new firmware release, run the first command again to pick it up.
# Web Serial only works over HTTPS, so put this behind your TLS reverse proxy
# (obcydian.dagamant.com -> http://<host>:${FLASHER_PORT:-3008}).

services:
  flasher:
    build:
      context: .
      args:
        FIRMWARE_VERSION: ${FIRMWARE_VERSION:-latest}
    image: obcydian-flasher
    container_name: obcydian-flasher
    ports:
      - "${FLASHER_PORT:-3008}:3008"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

; CYD Notes — Obsidian-style markdown notes for the 3.5" ESP32-32E "Cheap Yellow Display"
; Board: LCDWiki E32R35T (ESP32-32E, ST7796 320x480, XPT2046 resistive touch, CH340 USB-serial)

[env:cyd35]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 921600
monitor_filters = esp32_exception_decoder
upload_speed = 921600
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    greiman/SdFat@^2.2.3
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DDISABLE_FS_H_WARNING
